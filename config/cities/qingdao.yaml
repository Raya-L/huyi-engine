# 青岛市政策参数 qingdao.yaml
# 「护忆有方」测算模型 — 青岛配置（只写与国家基准不同的项）
# 负责人：殷子桐  版本：v0.1.2  日期：2026-10-27
# v0.1.2：统一结构；补全 settlement_periods 注释里年度限额约束语
#         （v0.1.1 “基金支付 = rho × min(实际费用, 支付标准)” 未写年度限额封顶，已补完整）；
#         covers_moderate 改 employee/resident 写法。
# v0.1.1 修订（审阅后）：
#   1. 写明结算口径：标准为费用上限，再乘支付比例（2026-10-23 电话核实）；
#   2. 补入居民 2027 年前的分档比例（一档 0.80、二档 0.75），模型从 2026 年起算需要；
#   3. 发布会日期统一为 4 月 17 日（4 月 18 日为报道日）。
#   4. 失智专区沿用 12 号文标准（失智职工 50、居民 35 元/天，封顶后乘比例）；青人社发〔2016〕27 号的 65 元/天“定额包干”为历史试点口径，不再使用。
version: "v0.1.2"
city: "qingdao"
updated: "2026-10-27"

settlement_periods:
