---
# 2021 年《长期护理失能等级评估标准（试行）》分档与组合表（规格书§3、表2/表3 原文）
# 用于 map_initial_state：三分级 → 组合法求测算等级 → 初始状态。
# 负责人：殷子桐  版本：v0.1  日期：2026-11-01
version: "v0.1"

# 各维度合计分 → 受损等级（范围含端点）
adl_grades:    # 日常生活活动 10 项合计 0–100
  intact:   [100, 100]
  mild:     [65, 95]
  moderate: [45, 60]
  severe:   [0, 40]
cog_grades:    # 认知能力 4 项合计 0–16
  intact:   [16, 16]
  mild:     [4, 15]
  moderate: [2, 3]
  severe:   [0, 1]
sense_grades:  # 感知觉与沟通 3 项合计 0–12
  intact:   [12, 12]
  mild:     [4, 11]
  moderate: [2, 3]
  severe:   [0, 1]

# 表3 组合表：行 = 日常生活活动(ADL) 等级，列 = 认知/感知觉较重一项的等级
# 取值即测算等级 0–5（与规格书表3逐格一致）
combo_rows: [intact, mild, moderate, severe]       # ADL: 完好/轻度/中度/重度
combo_cols: [intact, mild, moderate, severe]       # 认知: 完好/轻度/中度/重度
combo_grade:
  - [0, 0, 1, 1]     # ADL 完好
  - [1, 1, 1, 2]     # ADL 轻度
  - [2, 2, 2, 3]     # ADL 中度
  - [3, 3, 4, 5]     # ADL 重度
